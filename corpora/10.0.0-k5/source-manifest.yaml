corpus:
  name: opentrons-knowledge
  version: 10.0.0-k5
  target_opentrons_release: v10.0.0
  corpus_schema_version: 1

sources:
  opentrons_ai_v1:
    repository: https://github.com/Opentrons/opentrons
    tag: ai-server@0.0.22
    commit: 0b6a6ecd2d6e040e02f40bd1d44193cfc42b33dc
    paths:
      - opentrons-ai-server/api/storage/docs
    exclude_paths:
      - opentrons-ai-server/api/storage/docs/pd
    compatibility:
      status: validated
      target_release: v10.0.0
      relationship: latest-ai-server-tag
      validation_record: compatibility/opentrons-ai-v1-v10.0.0.yaml
      notes: >
        Curated Opentrons AI v1 protocol guides from the latest opentrons-ai-server
        release tag (ai-server@0.0.22). Protocol Designer subtree (pd/) is excluded.

  opentrons_docs:
    repository: https://github.com/Opentrons/opentrons
    tag: mkdocs-2026-09-30
    commit: 00f1431babdf36a11ec68143c009d5fc889b2478
    paths:
      - docs/python-api/docs
      - docs/python-api/mkdocs.yml
      - docs/flex/docs
      - docs/ot-2/docs
      - api/docs/v2/example_protocols
    build_target: mkdocs
    exclude_paths:
      - docs/python-api/docs/img
    compatibility:
      status: validated
      target_release: v10.0.0
      relationship: docs-deploy-tag-for-10.0.x
      validation_record: compatibility/opentrons-docs-v10.0.0.yaml
      notes: >
        Production MkDocs deploy for the 10.0.x line (mkdocs-2026-09-30).
        Publishes apiLevel 2.30 and robot_stack_version 10.0.0. Tag v10.0.0
        already reports the same apiLevel metadata; this pin tracks the post-release
        docs deploy. Include liquid-class-tables/*.md even though MkDocs excludes
        them from nav.

  protocol_api:
    repository: https://github.com/Opentrons/opentrons
    tag: v10.0.0
    commit: e8c6d0a424c25fff1604e2a02e4ccaedac95b9af
    paths:
      - api/src/opentrons/protocol_api
    compatibility:
      status: exact-release
      target_release: v10.0.0
      relationship: exact-release

  shared_data:
    repository: https://github.com/Opentrons/opentrons
    tag: v10.0.0
    commit: e8c6d0a424c25fff1604e2a02e4ccaedac95b9af
    paths:
      - shared-data/labware/definitions
      - shared-data/labware/schemas
      - shared-data/pipette/definitions
      - shared-data/pipette/schemas
      - shared-data/module/definitions
      - shared-data/module/schemas
      - shared-data/deck/definitions
      - shared-data/deck/schemas
      - shared-data/robot/definitions
      - shared-data/robot/schemas
      - shared-data/liquid-class/definitions
    compatibility:
      status: exact-release
      target_release: v10.0.0
      relationship: exact-release

  protocol_designer:
    repository: https://github.com/Opentrons/opentrons
    tag: protocol-designer@9.0.1
    commit: 677274a40c5d22044c4efe7365d4904a56eeefd4
    paths:
      - protocol-designer/src/constants.ts
      - protocol-designer/src/modules/moduleData.ts
      - protocol-designer/src/pages/Designer/DeckSetup/constants.ts
      - protocol-designer/src/pages/Designer/DeckSetup/utils.ts
      - protocol-designer/src/pages/Onboarding/constants.ts
      - protocol-designer/src/utils/labwareModuleCompatibility.ts
    compatibility:
      status: validated
      target_release: v10.0.0
      relationship: latest-protocol-designer-tag
      validation_record: compatibility/protocol-designer-v10.0.0.yaml
      notes: >
        This pin tracks the latest production Protocol Designer tag and is
        independent of the robot-stack v10.0.0 pin. The raw file is copied
        verbatim; protocol_designer_tables evaluates the tables at this commit.

builder:
  name: opentrons-knowledge-builder
  version: 0.1.0
  commit: null

processing:
  parser_version: 1
  normalization_version: 1
  relationship_model_version: 1
  chunking_strategy: semantic-sections-v1

# Render the pinned opentrons_docs commit with MkDocs and ship canonical/.
rendered_docs: {}

# Ship retrieval/ (documents, chunks, API index, docs index). Settings are the
# configuration selected in docs/retrieval-experiments.md; the build re-runs the
# experiment grid and writes reports/retrieval-eval.json.
retrieval:
  kinds: [doc_section, entity]
  chunking: structured
  enrichment: context_terms
  tokenizer: default
  queries: eval/retrieval/curated.yaml
  run_experiments: true

# Evaluate Protocol Designer's compatibility tables at the protocol_designer
# commit (tools/protocol-designer-export, through Vite) and write them to
# corpus/protocol-designer/*.json. getLabwareCompatibleWithModule runs against
# the shared_data labware definitions. No entities, relationships, or retrieval
# documents are created from these tables.
protocol_designer_tables: {}

publication:
  formats:
    - tar.zst
    - oci
  artifact_name_template: opentrons-knowledge-{version}.tar.zst
  registry: ghcr.io
  repository: opentrons/opentrons-knowledge
