# Curated retrieval evaluation set for the Opentrons Knowledge corpus.
#
# Status: DRAFT, awaiting docs-owner review. Questions are phrased the way users
# and OpentronsAI ask them, deliberately avoiding the exact heading text.
#
# Label forms (see src/opentrons_knowledge/retrieval/evaluation.py):
#   doc:<page_path>             any section of the page
#   doc:<page_path>#<anchor>    that section or one nested under it
#   api:<public name>           API reference section or symbol record
#   labware:<load_name> | pipette:<key> | module:<model>
#   guide:<file>[#<anchor>]     AI guide file or section
#
# A query hits when any label's documents appear in the top k results.
# Labels that stop resolving fail the evaluation, so stale labels are caught.
review:
  status: draft
  drafted: 2026-11-09
  reviewer: null
