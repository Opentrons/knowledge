site_name: Opentrons Documentation
docs_dir: ./shared

nav:
  - Python API: '!include python-api/mkdocs.yml'

plugins:
  - monorepo
  - search
  - macros:
      include_dir: python-api/docs

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - shared/icons
  - pymdownx.tabbed:
      alternate_style: true

extra:
  apiLevel: 2.30
  robot_stack_version: 10.0.0
